<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Tracker</title>
<meta name="description" content="Log poker sessions, see your stats and review hands.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poker Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F3EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C110F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single-column phone app shell (max 560px), sticky bottom tab bar, bottom sheets for entry. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface-2:#E7EBE4; --ink:#121915; --muted:#5A665F; --line:#D7DDD5;
  --accent:#2A42C2; --accent-ink:#FFFFFF; --accent-soft:#2A42C21A;
  --pos:#15784A; --neg:#BE3328; --warn:#9A6200;
  --suit-s:#121915; --suit-h:#C9302C; --suit-d:#2A62D6; --suit-c:#1C8A4E;
  --shadow:0 10px 30px -12px #12191540;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C110F; --surface:#141B18; --surface-2:#1B2420; --ink:#E6ECE8; --muted:#8D9B94; --line:#25302B;
  --accent:#8D9EFF; --accent-ink:#0C110F; --accent-soft:#8D9EFF22;
  --pos:#4BC489; --neg:#FF7A69; --warn:#E6B04B;
  --suit-s:#E6ECE8; --suit-h:#FF6B60; --suit-d:#7FA6FF; --suit-c:#57CF8C;
  --shadow:0 10px 30px -12px #00000099; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C110F; --surface:#141B18; --surface-2:#1B2420; --ink:#E6ECE8; --muted:#8D9B94; --line:#25302B;
  --accent:#8D9EFF; --accent-ink:#0C110F; --accent-soft:#8D9EFF22;
  --pos:#4BC489; --neg:#FF7A69; --warn:#E6B04B;
  --suit-s:#E6ECE8; --suit-h:#FF6B60; --suit-d:#7FA6FF; --suit-c:#57CF8C;
  --shadow:0 10px 30px -12px #00000099; color-scheme:dark }

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
[hidden]{display:none!important}
img{max-width:100%}
button,a,label{-webkit-tap-highlight-color:transparent}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.lock-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-box img{width:76px;height:76px;border-radius:18px;margin:0 auto;box-shadow:var(--shadow)}
.lock-box h1{font-size:24px}
.lock-box .input{text-align:center;font-size:18px;letter-spacing:.08em}
.mode-hands .nav{display:none}
.mode-hands .app{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
body:not(.mode-hands) .hands-only{display:none!important}
.mode-hands .stats-only{display:none!important}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px}
.btn.small svg{width:16px;height:16px}
.entry{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:72px}
.entry b{font-family:var(--f-display);font-size:18px;display:block}
.entry span{color:var(--muted);font-size:13.5px}
.entry .go{margin-left:auto;color:var(--accent);font-size:24px;line-height:1}
.entry-ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.entry-ico svg{width:24px;height:24px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* quick hand recorder */
.rec{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rec-head{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.rec-title{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-title b{font-family:var(--f-display);font-size:17px}
.rec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
.rbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;width:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.rbtn small{font-size:11.5px;font-weight:600;color:var(--muted)}
.rbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rbtn.on small{color:inherit;opacity:.75}
.rbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rbtn.pri small{color:inherit;opacity:.8}
.rbtn.warn{color:var(--neg)}
.rbtn:disabled{opacity:.25}
.rbtn:active:not(:disabled){transform:scale(.97)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rank-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.suit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.suit-grid .rbtn{font-size:30px;min-height:62px}
.slots{display:flex;gap:8px}
.slot{width:54px;height:70px;border-radius:9px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface)}
.slot:has(.c){border-style:solid}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actor{font-size:16px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.actor b{font-family:var(--f-display);font-size:18px}
.actor.me{background:var(--accent-soft)}
.seats{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seat{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:14.5px;min-height:42px}
.seat:first-child{border-top:0}
.seat.out{color:var(--muted);opacity:.5;min-height:28px;padding-block:2px;font-size:13px}
.seat.now{background:var(--accent-soft);font-weight:700}
.seat.skip{cursor:pointer}
.seat-stack{font-size:12.5px;color:var(--muted);text-decoration:underline dotted;padding:8px 0 8px 6px;cursor:pointer}
.rec-street{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.rec-street b{font-family:var(--f-display);font-size:21px}
.rec-street .c{font-size:17px}
.rec-sum{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.stepper{display:flex;align-items:center;gap:16px}
.stepper .rbtn{width:56px}
.stepper b{font-family:var(--f-display);font-size:22px;min-width:26px;text-align:center}
.rec-discard{display:block;margin:22px auto 0;color:var(--muted)}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:11px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
ol.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--accent)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand .pips{font-size:13px;letter-spacing:2px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

/* hero */
.hero{padding-block:6px 4px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:-.02em;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:11.5px;color:var(--muted)}
@media (max-width:380px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* live */
.live{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--neg);display:inline-block;box-shadow:0 0 0 0 var(--neg);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--neg) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
.live-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.live-row div{min-width:0}
.live-row b{font-family:var(--f-display);font-size:20px;display:block}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.danger.solid{background:var(--neg);color:var(--surface);border-color:var(--neg)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}

/* session rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.rows .row:first-child{border-top:0}
.date-tile{width:44px;text-align:center;line-height:1.05}
.date-tile b{display:block;font-family:var(--f-display);font-size:19px}
.date-tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row-main{min-width:0}
.row-main .t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row-main .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{text-align:right}
.row-amt b{font-family:var(--f-display);font-size:16.5px;display:block}
.row-amt span{font-size:11.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.tag.t-tourn{background:var(--accent-soft);color:var(--accent)}
.month-head{display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px 4px}
.month-head h3{font-size:16px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button,.seg label{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;cursor:pointer}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0000001f}
.seg label{padding:0;display:flex}
.seg label span{flex:1;padding:8px 6px;border-radius:9px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:focus-visible) span{outline:2px solid var(--accent)}

/* stats */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.metric span{font-size:12px;color:var(--muted);display:block}
.metric b{font-family:var(--f-display);font-size:21px;font-weight:700;display:block;margin-top:2px}
.metric.wide{grid-column:1/-1}
.metric.wide b{font-size:34px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table.bk{border-collapse:collapse;width:100%;font-size:13.5px;min-width:300px}
table.bk th,table.bk td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.bk th:first-child,table.bk td:first-child{text-align:left;color:var(--muted);font-weight:500}
table.bk thead th{border-top:0;font-family:var(--f-display);font-weight:700;color:var(--ink)}
table.bk thead th:first-child{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:12px}
.foot{font-size:12.5px;color:var(--muted)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.chart .tiptext{font-size:10.5px;fill:var(--ink);font-weight:600}
.empty-note{color:var(--muted);font-size:14px;margin:6px 0}

/* hands */
.hand-row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hand-row .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);align-items:center}
.hand-row .txt{font-family:var(--f-mono);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hand-row .sum{font-size:13.5px;margin-top:6px}
.verdict{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.v-good{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.v-close{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.v-bad{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.v-none{background:var(--surface-2);color:var(--muted)}
.v-study{background:var(--accent-soft);color:var(--accent)}
.bestplay{display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);margin-top:8px;padding-top:8px}
.bestplay b{font-size:18px;color:var(--ink)}
.did{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-top:10px;font-size:14px}
.handtext{font-family:var(--f-mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:10px;padding:12px;margin:0}
.c{font-weight:700;white-space:nowrap}
.c-s{color:var(--suit-s)} .c-h{color:var(--suit-h)} .c-d{color:var(--suit-d)} .c-c{color:var(--suit-c)}
.verdict-banner{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.verdict-banner b{font-family:var(--f-display);font-size:22px}
.analysis h4{font-family:var(--f-display);font-size:15.5px;margin:18px 0 6px}
.analysis p{margin:0 0 10px;max-width:65ch}
.analysis ul{margin:0 0 10px;padding-left:20px}
.analysis li{margin-bottom:5px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.qa{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.qa .q{font-weight:600;margin-bottom:6px}
.askbar{display:flex;gap:8px;margin-top:14px}
.askbar textarea{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;font-size:14.5px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;min-height:44px}
textarea.input{resize:vertical;line-height:1.45}
textarea.mono{font-family:var(--f-mono);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money{position:relative}
.money::before{content:"£";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money .input{padding-left:26px}
.preview{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.preview b{font-family:var(--f-display);font-size:24px}
.err{color:var(--neg);font-size:13.5px;min-height:1em}
.confirm{background:color-mix(in srgb,var(--neg) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--neg) 35%,var(--line));border-radius:12px;padding:12px}
details.guide{font-size:13.5px}
details.guide summary{cursor:pointer;color:var(--accent);font-weight:600}
details.guide pre{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:8px;margin:8px 0 0}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:#0008}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.grabber{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{background:var(--surface-2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;color:var(--muted)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:23px;height:23px}
.nav .add{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);justify-self:center;font-size:28px;line-height:1;padding:0;justify-content:center;box-shadow:var(--shadow)}
.nav .add svg{width:26px;height:26px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.notice{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .suits{font-size:26px;letter-spacing:6px;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="pips"><span class="c-s">♠</span><span class="c-h">♥</span><span class="c-d">♦</span><span class="c-c">♣</span></span>Poker Session Tracker</div>
    <div class="topbar-actions">
    <button class="btn small hands-only" data-action="go-stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>My stats</button>
    <button class="iconbtn stats-only" data-action="settings" aria-label="Backup and restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></button>
    </div>
  </div>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="Sections">
  <div class="nav-inner">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Home</button>
    <button data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>Sessions</button>
    <button class="add" data-action="new-session" aria-label="Add session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 14 4-4 3 3 5-6"/></svg>Stats</button>
    <button data-tab="hands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="5" width="10" height="15" rx="2" transform="rotate(-10 8.5 12.5)"/><rect x="10" y="4" width="10" height="15" rx="2" transform="rotate(8 15 11.5)"/></svg>Hands</button>
  </div>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-action="close-sheet"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" id="sheet-panel"></div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="lock" class="lock"></div>
<div id="rec" class="rec" hidden></div>

<script>
"use strict";
// ---------- state ----------
const S = {
  sessions: [], hands: [], live: null,
  tab: "home", filter: "all", seg: "overall", handId: null,
  db: null, loading: true, noDb: false, readOnly: false, streaming: null,
};
try { const t = localStorage.getItem("pst.tab"); if (t && t !== "hands") S.tab = t; } catch (e) {}
S.lastStatsTab = S.tab;

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const toMin = t => { if (!t) return null; const [h, m] = String(t).split(":").map(Number); return isFinite(h) && isFinite(m) ? h * 60 + m : null; };
function hoursOf(s) { const a = toMin(s.start), b = toMin(s.end); if (a == null || b == null) return 0; let d = b - a; if (d < 0) d += 1440; return d / 60; }
const plOf = s => (isNum(s.buyIn) && isNum(s.cashOut)) ? Math.round((s.cashOut - s.buyIn) * 100) / 100 : null;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad = n => String(n).padStart(2, "0");
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function nowHM() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dParts(iso) { const [y, m, d] = iso.split("-").map(Number); return { y, m, d }; }
function fmtDate(iso, withYear) { if (!iso) return ""; const { y, m, d } = dParts(iso); return `${d} ${MONTHS[m - 1]}${withYear ? " " + y : ""}`; }
function weekday(iso) { const { y, m, d } = dParts(iso); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(y, m - 1, d).getDay()]; }
function money(n, opts = {}) {
  if (n == null || !isFinite(n)) return "—";
  const sign = opts.sign !== false;
  const abs = Math.abs(n);
  const dec = opts.dec ?? (Math.round(abs * 100) % 100 ? 2 : 0);
  const s = abs.toLocaleString("en-GB", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return (n < 0 ? "−" : (sign && n > 0 ? "+" : "")) + "£" + s;
}
function moneyShort(n) {
  const abs = Math.abs(n), sg = n < 0 ? "−" : "";
  if (abs >= 1000) return sg + "£" + (abs / 1000).toFixed(abs >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
  return sg + "£" + Math.round(abs);
}
const pct = v => v == null || !isFinite(v) ? "—" : (v * 100).toFixed(1).replace(/\.0$/, "") + "%";
const hrs = h => (Math.round(h * 10) / 10).toLocaleString("en-GB") + "h";
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
function dur(h) { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h ${pad(m % 60)}m`; }

function sorted(list = S.sessions) {
  return [...list].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (toMin(a.start) ?? 0) - (toMin(b.start) ?? 0) || (a.createdAt || 0) - (b.createdAt || 0));
}
// Mirrors the spreadsheet's SUMMARY block exactly.
function stats(list) {
  const done = list.filter(s => plOf(s) != null);
  const n = done.length;
  const pls = done.map(plOf);
  const pl = pls.reduce((a, b) => a + b, 0);
  const hours = done.reduce((a, s) => a + hoursOf(s), 0);
  const wins = pls.filter(p => p > 0).length;
  const buyIns = done.reduce((a, s) => a + s.buyIn, 0);
  return {
    n, pl, hours, wins, buyIns,
    best: n ? Math.max(...pls) : null, worst: n ? Math.min(...pls) : null,
    avg: n ? pl / n : null, perHr: hours ? pl / hours : null,
    winRate: n ? wins / n : null, roi: buyIns ? pl / buyIns : null,
  };
}
const segFilter = seg => s => seg === "overall" || (seg === "cash" ? s.game === "Cash" : s.game === "Tournament");
// venue is Public (strangers) or Home. Public games are a Casino or a Private game (kind).
// Named venues ("Hippodrome") are saved per group: Casino, Private or Home.
const groupOf = s => s.venue === "Home" ? "Home" : (s.kind || "");
const GROUP_LABEL = { Casino: "Casino", Private: "Private game", Home: "Home" };
function venuesFor(type) {
  const last = {};
  for (const s of S.sessions) if (groupOf(s) === type && s.venueName && (!(s.venueName in last) || s.date > last[s.venueName])) last[s.venueName] = s.date;
  for (const n of (STORE?.venues?.[type] || [])) if (!(n in last)) last[n] = "";
  return Object.keys(last).sort((a, b) => (last[b] || "").localeCompare(last[a] || "") || a.localeCompare(b));
}
const canonicalVenue = (type, name) => venuesFor(type).find(n => n.toLowerCase() === name.toLowerCase()) || name;
function rememberVenue(type, name) {
  if (!name || !STORE) return;
  STORE.venues[type] ||= [];
  if (!STORE.venues[type].includes(name)) STORE.venues[type].push(name);
}
const venueLabel = s => s.venueName || GROUP_LABEL[groupOf(s)] || s.venue;
function blindsList(venue) {
  const order = s => { const m = String(s).match(/[\d.]+/g); return m ? m.map(Number).reduce((a, b) => a * 1000 + b, 0) : 0; };
  return [...new Set(S.sessions.filter(s => s.game === "Cash" && (!venue || s.venue === venue) && s.blinds).map(s => s.blinds))].sort((a, b) => order(a) - order(b));
}

// card notation: AsKd -> coloured suit glyphs
const SUIT = { s: "♠", h: "♥", d: "♦", c: "♣" };
function cardify(html) {
  return html.replace(/\b((?:(?:10|[AKQJT2-9])[shdc]){1,5})\b/g, (m, grp, off, str) => {
    // only single cards when clearly cards (avoid words like "As", "Js")
    const parts = grp.match(/(10|[AKQJT2-9])([shdc])/g);
    if (parts.length === 1 && /^[AKQJ][s]$/.test(grp)) return m;
    return parts.map(p => { const r = p.slice(0, -1), su = p.slice(-1); return `<span class="c c-${su}">${r === "10" ? "T" : r}${SUIT[su]}</span>`; }).join("");
  });
}
function inline(s) { return cardify(s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>")); }
function md(src) {
  const lines = esc(src).split("\n");
  let html = "", list = false, para = [];
  const flush = () => { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
  const endList = () => { if (list) { html += "</ul>"; list = false; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (/^#{1,6}\s/.test(l)) { flush(); endList(); html += "<h4>" + inline(l.replace(/^#+\s*/, "")) + "</h4>"; continue; }
    if (/^[-*•]\s+/.test(l)) { flush(); if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(l.replace(/^[-*•]\s+/, "")) + "</li>"; continue; }
    if (!l) { flush(); endList(); continue; }
    endList(); para.push(l);
  }
  flush(); endList();
  return html;
}

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- charts ----------
function nice(x) { const e = Math.pow(10, Math.floor(Math.log10(x))); const f = x / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function ticks(lo, hi, n) {
  if (hi === lo) { hi = lo + 100; }
  const step = nice((hi - lo) / n); const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
const CHARTS = {};
function runChart(id, list) {
  if (list.length < 2) return `<p class="empty-note">The running P&amp;L curve appears once you have two sessions here.</p>`;
  let run = 0;
  const pts = [{ i: 0, y: 0 }].concat(list.map((s, k) => ({ i: k + 1, y: (run = Math.round((run + plOf(s)) * 100) / 100), s })));
  const W = 340, H = 196, L = 42, R = 10, T = 22, B = 22;
  const tk = ticks(Math.min(0, ...pts.map(p => p.y)), Math.max(0, ...pts.map(p => p.y)), 4);
  const lo = tk[0], hi = tk[tk.length - 1];
  const X = i => L + (i / (pts.length - 1)) * (W - L - R);
  const Y = v => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const line = pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const y0 = Y(0).toFixed(1);
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${y0} L${X(0).toFixed(1)} ${y0} Z`;
  const last = pts[pts.length - 1];
  CHARTS[id] = { pts, X, Y, W, H, T, B, L, R };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" data-chart="${id}" role="img" aria-label="Running profit and loss over ${list.length} sessions, ending at ${money(last.y)}">
    <defs>
      <clipPath id="${id}-up"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath>
      <clipPath id="${id}-dn"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath>
    </defs>
    ${tk.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.2 : 0.6}" ${v === 0 ? "" : 'stroke-dasharray="2 3"'}/>
      <text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${moneyShort(v)}</text>`).join("")}
    <path d="${area}" fill="var(--pos)" opacity=".13" clip-path="url(#${id}-up)"/>
    <path d="${area}" fill="var(--neg)" opacity=".13" clip-path="url(#${id}-dn)"/>
    <path d="${line}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round" clip-path="url(#${id}-up)"/>
    <path d="${line}" fill="none" stroke="var(--neg)" stroke-width="2" stroke-linejoin="round" clip-path="url(#${id}-dn)"/>
    <circle cx="${X(last.i).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4" fill="${last.y >= 0 ? "var(--pos)" : "var(--neg)"}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H - 6}">${fmtDate(list[0].date)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(list[list.length - 1].date)} · #${list.length}</text>
    <g id="${id}-tip"></g>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H - B}" fill="transparent" data-hit="${id}"/>
  </svg></div>`;
}
function monthChart(list) {
  const by = {};
  for (const s of list) { const k = (s.date || "").slice(0, 7); if (!k) continue; by[k] = (by[k] || 0) + plOf(s); }
  const keys = Object.keys(by).sort().slice(-12);
  if (!keys.length) return `<p class="empty-note">No sessions yet.</p>`;
  const vals = keys.map(k => Math.round(by[k] * 100) / 100);
  const W = 340, H = 180, L = 42, R = 8, T = 18, B = 22;
  const tk = ticks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const lo = tk[0], hi = tk[tk.length - 1];
  const Y = v => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const bw = (W - L - R) / keys.length, gap = Math.min(10, bw * 0.3);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit and loss by month">
    ${tk.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.2 : 0.6}" ${v === 0 ? "" : 'stroke-dasharray="2 3"'}/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${moneyShort(v)}</text>`).join("")}
    ${keys.map((k, i) => { const v = vals[i], x = L + i * bw + gap / 2, w = bw - gap, y = Math.min(Y(v), Y(0)), h = Math.max(1, Math.abs(Y(v) - Y(0)));
      const m = Number(k.slice(5)), lbl = MONTHS[m - 1];
      const ty = v >= 0 ? Y(v) - 4 : Y(v) + 11;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v >= 0 ? "var(--pos)" : "var(--neg)"}" opacity=".85"/>
        <text x="${(x + w / 2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" class="tiptext" style="font-size:9.5px">${moneyShort(v)}</text>
        <text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${lbl}</text>`; }).join("")}
  </svg></div>`;
}
function bindCharts() {
  document.querySelectorAll("rect[data-hit]").forEach(r => {
    const id = r.dataset.hit, c = CHARTS[id], svg = r.ownerSVGElement, tip = svg.querySelector(`#${id}-tip`);
    const show = e => {
      const box = svg.getBoundingClientRect();
      const x = (e.clientX - box.left) / box.width * c.W;
      const i = Math.max(1, Math.min(c.pts.length - 1, Math.round((x - c.L) / (c.W - c.L - c.R) * (c.pts.length - 1))));
      const p = c.pts[i], px = c.X(p.i), py = c.Y(p.y), pl = plOf(p.s);
      const label = `#${p.i} · ${fmtDate(p.s.date)} · ${money(pl)} → ${money(p.y)}`;
      const tx = Math.max(c.L + 2, Math.min(c.W - c.R - 2, px));
      const anchor = tx < c.W * 0.3 ? "start" : tx > c.W * 0.7 ? "end" : "middle";
      tip.innerHTML = `<line x1="${px}" x2="${px}" y1="${c.T - 6}" y2="${c.H - c.B}" stroke="var(--muted)" stroke-width=".7"/>
        <circle cx="${px}" cy="${py}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${tx}" y="10" text-anchor="${anchor}" class="tiptext">${esc(label)}</text>`;
    };
    r.addEventListener("pointermove", show);
    r.addEventListener("pointerdown", show);
    r.addEventListener("pointerleave", () => tip.innerHTML = "");
  });
}

// ---------- views ----------
function sessionRow(s, running) {
  const pl = plOf(s), { d, m } = dParts(s.date);
  const what = s.game === "Tournament" ? "Tournament" : `${esc(s.blinds || "Cash")}`;
  const sub = [s.venueName ? (GROUP_LABEL[groupOf(s)] || s.venue) : "", weekday(s.date), s.start && s.end ? `${s.start}–${s.end} · ${hrs(hoursOf(s))}` : "", `in ${money(s.buyIn, { sign: false })}`].filter(Boolean).join(" · ");
  return `<button class="row" data-action="edit-session" data-id="${esc(s.id)}">
    <div class="date-tile"><b>${d}</b><span>${MONTHS[m - 1]}</span></div>
    <div class="row-main"><div class="t">${what}<span class="tag ${s.game === "Tournament" ? "t-tourn" : ""}">${esc(venueLabel(s))}</span></div>
      <div class="s">${esc(sub)}</div>${s.notes ? `<div class="s">“${esc(s.notes)}”</div>` : ""}</div>
    <div class="row-amt num"><b class="${cls(pl)}">${money(pl)}</b>${running != null ? `<span>${money(running)}</span>` : ""}</div>
  </button>`;
}
function runningMap() { const m = {}; let r = 0; for (const s of sorted()) { r = Math.round((r + (plOf(s) ?? 0)) * 100) / 100; m[s.id] = r; } return m; }

function liveCard() {
  const L = S.live;
  if (!L) return `<section class="card"><div class="card-head"><h3>At the table?</h3></div>
    <p class="muted" style="margin:0">Start a live session when you sit down. It times the session and keeps your buy-ins, so cashing out takes one tap.</p>
    <div class="btnrow"><button class="btn primary" data-action="start-live" ${S.readOnly ? "disabled" : ""}>Start live session</button></div></section>`;
  const el = L.startedAt ? (Date.now() - L.startedAt) / 3600000 : 0;
  return `<section class="card live"><div class="card-head"><h3><span class="live-dot"></span>&nbsp; Live · ${L.game === "Tournament" ? "Tournament" : esc(L.blinds || "Cash")} · ${esc(venueLabel(L))}</h3><span class="muted">from ${esc(L.start)}</span></div>
    <div class="live-row num"><div><span class="muted">Time</span><b id="live-elapsed">${dur(el)}</b></div><div><span class="muted">In for</span><b>${money(L.buyIn, { sign: false })}</b></div>${L.rebuys ? `<div><span class="muted">Rebuys</span><b>${L.rebuys}</b></div>` : ""}</div>
    <div class="btnrow"><button class="btn" data-action="rebuy">+ Rebuy / top-up</button><button class="btn primary" data-action="end-live">Cash out</button><button class="btn" data-action="cancel-live" style="margin-left:auto">Discard</button></div>
    <div id="live-confirm"></div></section>`;
}

function viewHome() {

function dataNudge() {

    <p class="muted" style="margin:0">Restore your backup file to load your history. It's in iCloud Drive as <b>Poker Tracker backup.json</b>.</p>

  if (STORE.dirty && Date.now() - lb > 14 * 864e5) return `<div class="notice" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span>${lb ? `Last backup ${fmtDate(new Date(lb).toISOString().slice(0, 10))}.` : "You haven't backed up yet."} Your data lives only on this phone.</span><button class="btn" data-action="backup">Back up</button></div>`;

}
function emptySessions() {
  return `<div class="empty"><div class="suits"><span class="c-s">♠</span><span class="c-h">♥</span><span class="c-d">♦</span><span class="c-c">♣</span></div>${S.loading ? "Loading your sessions…" : "No sessions yet. Tap + to log your first one."}</div>`;
}

function viewSessions() {
  const F = S.filter;
  const filt = s => F === "all" || (F === "cash" && s.game === "Cash") || (F === "tourn" && s.game === "Tournament") || (F === "public" && s.venue === "Public") || (F === "home" && s.venue === "Home") || (F === "casino" && groupOf(s) === "Casino") || (F === "private" && groupOf(s) === "Private") || (F.startsWith("v:") && s.venueName === F.slice(2));
  const rm = runningMap();
  const list = sorted().filter(filt).reverse();
  const st = stats(list);
  const groups = [];
  for (const s of list) { const k = s.date.slice(0, 7); let g = groups[groups.length - 1]; if (!g || g.k !== k) groups.push(g = { k, items: [] }); g.items.push(s); }
  const chip = (k, l) => `<button class="chip" aria-pressed="${F === k}" data-filter="${esc(k)}">${esc(l)}</button>`;
  const named = [...new Set(["Casino", "Private", "Home"].flatMap(venuesFor))].filter(n => S.sessions.some(s => s.venueName === n));
  return `<div class="stack">
    <div class="card-head" style="margin:0"><h2>Sessions</h2><span class="muted num">${st.n} · <b class="${cls(st.pl)}">${money(st.pl)}</b></span></div>
    <div class="chips">${chip("all", "All")}${chip("cash", "Cash")}${chip("tourn", "Tournament")}${chip("public", "Public")}${chip("home", "Home")}${chip("casino", "Casino")}${chip("private", "Private game")}</div>
    ${named.length ? `<div class="chips">${named.map(n => chip("v:" + n, n)).join("")}</div>` : ""}
    ${list.length ? groups.map(g => { const gs = stats(g.items); const { y, m } = dParts(g.k + "-01");
      return `<div><div class="month-head"><h3>${["January","February","March","April","May","June","July","August","September","October","November","December"][m - 1]} ${y}</h3><span class="num muted">${gs.n} · <b class="${cls(gs.pl)}">${money(gs.pl)}</b></span></div>
      <div class="card" style="padding:4px 14px"><div class="rows">${g.items.map(s => sessionRow(s, rm[s.id])).join("")}</div></div></div>`; }).join("") : `<div class="card">${emptySessions()}</div>`}
    ${S.sessions.some(s => !s.venueName) ? `<div class="notice" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span><b>${S.sessions.filter(s => !s.venueName).length}</b> sessions have no venue yet.</span><button class="btn" data-action="fill-venues">Fill in venues</button></div>` : ""}
    <p class="foot">Grey figure under each result is your running P&amp;L after that session. Tap a session to edit or delete it.</p>
  </div>`;
}

function breakdown(venue) {
  const base = S.sessions.filter(s => s.game === "Cash" && s.venue === venue);
  const cols = [{ h: `All ${venue}`, st: stats(base) }].concat(blindsList(venue).map(b => ({ h: b, st: stats(base.filter(s => s.blinds === b)) })));
  const rowsDef = [
    ["Sessions", s => s.n], ["Winning sessions", s => s.wins], ["Win rate", s => pct(s.winRate)],
    ["Total P&L", s => `<span class="${cls(s.pl)}">${money(s.pl)}</span>`], ["Avg P&L / session", s => `<span class="${cls(s.avg)}">${money(s.avg, { dec: 2 })}</span>`],
    ["Biggest win", s => money(s.best)], ["Biggest loss", s => money(s.worst)], ["Total hours", s => hrs(s.hours)],
    ["Avg £/hr", s => `<span class="${cls(s.perHr)}">${s.perHr == null ? "—" : money(s.perHr, { dec: 2 })}</span>`], ["Total buy-ins", s => money(s.buyIns, { sign: false })], ["ROI", s => `<span class="${cls(s.roi)}">${pct(s.roi)}</span>`],
  ];
  return `<section class="card"><div class="card-head"><h3>${venue} cash by blinds</h3></div>
    ${base.length ? `<div class="tablewrap"><table class="bk num"><thead><tr><th>Blinds</th>${cols.map(c => `<th>${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody>${rowsDef.map(([l, f]) => `<tr><td>${l}</td>${cols.map(c => `<td>${c.st.n ? f(c.st) : "—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="empty-note">No ${venue.toLowerCase()} cash sessions yet.</p>`}
  </section>`;
}
function venueTable(list) {
  const groups = {};
  for (const s of list) (groups[JSON.stringify([GROUP_LABEL[groupOf(s)] || s.venue, s.venueName || ""])] ||= []).push(s);
  const rows = Object.entries(groups).map(([k, items]) => { const [type, name] = JSON.parse(k); return { type, name, st: stats(items) }; })
    .sort((a, b) => !a.name - !b.name || b.st.n - a.st.n);
  if (!rows.length) return "";
  return `<section class="card"><div class="card-head"><h3>By venue</h3><span style="display:flex;gap:14px"><button class="linkbtn" data-action="fill-venues">Fill in</button><button class="linkbtn" data-action="manage-venues">Edit names</button></span></div>
    <div class="tablewrap"><table class="bk num"><thead><tr><th>Venue</th><th>Sessions</th><th>P&amp;L</th><th>£/hr</th><th>Win rate</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><span style="color:var(--ink);font-weight:600">${esc(r.name || "No name")}</span> <span class="tag">${r.type}</span></td><td>${r.st.n}</td><td class="${cls(r.st.pl)}">${money(r.st.pl)}</td><td class="${cls(r.st.perHr)}">${r.st.perHr == null ? "—" : money(r.st.perHr, { dec: 2 })}</td><td>${pct(r.st.winRate)}</td></tr>`).join("")}
    </tbody></table></div>${rows.some(r => !r.name) ? `<p class="foot" style="margin:10px 0 0">“No name” covers sessions logged before venues had names. Use <b>Fill in</b> to set lots at once by day and game type.</p>` : ""}</section>`;
}
// ---------- fill in venues by pattern ----------
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function dayIdx(iso) { const { y, m, d } = dParts(iso); return (new Date(y, m - 1, d).getDay() + 6) % 7; }
function fillSheet() {
  const missing = S.sessions.filter(s => !s.venueName).length;
  return `<div class="sheet-head"><h2>Fill in venues</h2><button class="x" data-action="close-sheet" aria-label="Close">×</button></div>
  <form class="stack" data-form="fill" novalidate>
    <p class="muted" style="margin:0"><b>${missing}</b> session${missing === 1 ? "" : "s"} still need a venue. Describe a pattern and every matching session without a venue is filled in. Sessions you've already named are never changed.</p>
    <h3>Which sessions</h3>
    <div class="field"><span>Game type</span>${segRadio("fgame", ["Any", "Cash", "Tournament"], "Any")}</div>
    <div class="field"><span>Day of the week <span style="font-weight:400">· tap any that apply</span></span><div class="chips wrap">${DAYS.map((d, i) => `<button type="button" class="chip" data-day="${i}" aria-pressed="false">${d}</button>`).join("")}</div></div>
    <label class="field" id="fblinds-field"><span>Blinds</span><select class="input" name="fblinds"><option value="">Any</option>${blindsList().map(b => `<option>${esc(b)}</option>`).join("")}</select></label>
    <h3>Venue to set</h3>
    <div class="field">${segRadio("fgroup", ["Casino", "Private", "Home"], "Casino", { Private: "Private game" })}</div>
    <div class="field"><div id="fill-chips" data-type="Casino">${venueChips("Casino", "f-fill")}</div><input class="input" id="f-fill" name="fname" placeholder="Venue name, e.g. Black Horse" autocomplete="off"></div>
    <div class="preview" style="display:block"><div class="eyebrow">Matches</div><div id="fill-preview" class="foot" style="margin-top:4px"></div></div>
    <button class="btn primary block" id="fill-apply" disabled>Fill in venues</button>
    ${S.lastFill ? `<button type="button" class="btn block" data-action="undo-fill">Undo last fill (${S.lastFill.length} session${S.lastFill.length === 1 ? "" : "s"})</button>` : ""}
  </form>`;
}
function fillRule(form) {
  const fd = new FormData(form);
  return { game: fd.get("fgame"), days: [...form.querySelectorAll("[data-day][aria-pressed=true]")].map(b => +b.dataset.day),
    blinds: fd.get("fgame") === "Tournament" ? "" : (fd.get("fblinds") || ""), group: fd.get("fgroup"), name: String(fd.get("fname") || "").trim() };
}
// Casino / Private game venues apply to Public sessions, Home venues to Home sessions.
const fillMatches = r => S.sessions.filter(s => !s.venueName && (r.group === "Home" ? s.venue === "Home" : s.venue === "Public")
  && (r.game === "Any" || s.game === r.game) && (!r.days.length || r.days.includes(dayIdx(s.date))) && (!r.blinds || s.blinds === r.blinds));
function updateFill(form) {
  const r = fillRule(form), m = fillMatches(r);
  const fc = $("#fill-chips");
  if (fc.dataset.type !== r.group) { fc.dataset.type = r.group; fc.innerHTML = venueChips(r.group, "f-fill"); }
  fc.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.val.toLowerCase() === r.name.toLowerCase())));
  $("#fblinds-field").hidden = r.game === "Tournament";
  const where = r.group === "Home" ? "Home" : "Public";
  $("#fill-preview").innerHTML = m.length
    ? `<b class="num" style="font-size:17px;color:var(--ink)">${m.length} ${where} session${m.length === 1 ? "" : "s"}</b><br>${[...m].sort((a, b) => a.date.localeCompare(b.date)).map(s => `${weekday(s.date)} ${fmtDate(s.date)} · ${s.game === "Tournament" ? "Tournament" : esc(s.blinds || "Cash")} · ${money(plOf(s))}`).join("<br>")}`
    : `No ${where} sessions without a venue match this pattern.`;
  const btn = $("#fill-apply");
  btn.disabled = !m.length || !r.name;
  btn.textContent = !m.length ? "Fill in venues" : r.name ? `Set ${m.length} session${m.length === 1 ? "" : "s"} to ${r.name}` : "Now choose the venue";
}
function applyFill(form) {
  const r = fillRule(form), m = fillMatches(r);
  if (!m.length || !r.name) return;
  const name = canonicalVenue(r.group, r.name);
  S.lastFill = m.map(x => ({ id: x.id, kind: STORE.sessions[x.id].kind }));
  for (const x of m) { const d = STORE.sessions[x.id]; d.venueName = name; d.kind = r.group === "Home" ? "" : r.group; }
  rememberVenue(r.group, name); persist();
  openSheet(fillSheet()); updateFill($("#sheet-panel form"));
  toast(`${m.length} session${m.length === 1 ? "" : "s"} set to ${name}`);
}
function undoFill() {
  for (const { id, kind } of S.lastFill || []) { const d = STORE.sessions[id]; if (!d) continue; delete d.venueName; if (kind) d.kind = kind; else delete d.kind; }
  const n = S.lastFill?.length || 0; S.lastFill = null; persist();
  openSheet(fillSheet()); updateFill($("#sheet-panel form")); toast(`Undid ${n} session${n === 1 ? "" : "s"}`);
}

function venuesSheet() {
  const all = ["Casino", "Private", "Home"].flatMap(t => venuesFor(t).map(n => ({ t, n, count: S.sessions.filter(s => groupOf(s) === t && s.venueName === n).length })));
  return `<div class="sheet-head"><h2>Venues</h2><button class="x" data-action="close-sheet" aria-label="Close">×</button></div>

const VERDICTS = { "good play": "v-good", "reasonable": "v-good", "close spot": "v-close", "mistake": "v-bad", "big mistake": "v-bad", "spot study": "v-study" };
const vClass = v => VERDICTS[String(v || "").toLowerCase()] || "v-none";

function parseAnalysis(text) {
  const verdict = (text.match(/^\s*\**VERDICT:?\**\s*:?\s*(.+)$/im) || [])[1]?.replace(/\*+/g, "").trim() || "";
  const summary = (text.match(/^\s*\**SUMMARY:?\**\s*:?\s*(.+)$/im) || [])[1]?.replace(/\*+/g, "").trim() || "";
  const bestPlay = (text.match(/^\s*\**BEST PLAY:?\**\s*:?\s*(.+)$/im) || [])[1]?.replace(/\*+/g, "").trim() || "";
  const body = text.replace(/^\s*\**VERDICT.*$/im, "").replace(/^\s*\**SUMMARY.*$/im, "").replace(/^\s*\**BEST PLAY.*$/im, "").trim();
  const v = Object.keys(VERDICTS).sort((a, b) => b.length - a.length).find(k => verdict.toLowerCase().includes(k));
  return { verdict: v ? v[0].toUpperCase() + v.slice(1) : verdict, summary, bestPlay, body };
}
function playerProfile() {
  const st = HSTORE.stakes || [];
  return `About the player: a live player in the UK who plays low-stakes cash games${st.length ? ` (${st.join(", ")})` : ""} in casinos, in private games with strangers and in home games with friends, plus small live tournaments (£20 to £90 buy-ins). Assume typical live low-stakes player pools (lots of limping, calling too wide preflop, under-bluffed rivers, big raises meaning strength) unless the notes say otherwise.`;
}

Game: ${h.game || "Cash"}${h.stakes ? `\nStakes / level: ${h.stakes}` : ""}${h.context ? `\nExtra context from the player (may include showdown info): ${h.context}` : ""}
Hand notes:
"""
${h.text}
"""
${h.action ? `What the player actually did at the final decision: ${h.action}` : `The player did not say separately what they did at the final decision. Often the notes stop at the spot they were unsure about.`}

Judge every decision only on the information the player had when they made it. If the notes or extra context reveal villain's cards or the result of the hand (for example a showdown), do not let that change the verdict or the best play. Use it only to comment on the read and on what it suggests about that player's tendencies.

First identify the final (key) decision point in the hand. Then grade the player's play like this:

const APP_VERSION = "12";
// ---------- on-device storage (encrypted with your password) ----------
// Same small API the page used with Claude's database. Data is kept in memory while
// unlocked and saved to localStorage encrypted with AES-GCM, keyed from the password.
const OLD_KEY = "pst.data.v1", VAULT_KEY = "pst.vault.v1", LOCK_AFTER_MS = 5 * 60 * 1000;
let STORE = null, CK = null, SALT = null, saving = Promise.resolve(), hiddenAt = 0;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function b64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function readVault() { try { return JSON.parse(localStorage.getItem(VAULT_KEY)); } catch (e) { return null; } }
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 210000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal() {
  if (!STORE || !CK) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, CK, new TextEncoder().encode(JSON.stringify(STORE)));
  localStorage.setItem(VAULT_KEY, JSON.stringify({ v: 1, salt: b64(SALT), iv: b64(iv), ct: b64(ct) }));
}
async function openVault(pw) {
  const v = readVault(), salt = unb64(v.salt), key = await deriveKey(pw, salt);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.iv) }, key, unb64(v.ct)); // throws on a wrong password
  return { key, salt, data: JSON.parse(new TextDecoder().decode(pt)) };
}
// Hands are kept apart from your stats and don't need the password.
const HANDS_KEY = "pst.hands.v1";
let HSTORE = { hands: {}, stakes: [] };
try { HSTORE = { ...HSTORE, ...(JSON.parse(localStorage.getItem(HANDS_KEY)) || {}) }; } catch (e) {}
function saveHands() {
  try { localStorage.setItem(HANDS_KEY, JSON.stringify(HSTORE)); } catch (e) { toast("Couldn't save on this phone. Make a backup now."); }
  sync();
}
// Older versions kept hands inside the encrypted stats; move them out once.
function moveHandsOut() {
  const old = STORE?.hands; if (!old) return 0;
  let n = 0;
  for (const [id, h] of Object.entries(old)) if (!(id in HSTORE.hands)) { HSTORE.hands[id] = h; n++; }
  delete STORE.hands; HSTORE.migrated = true; saveHands();
  return n;
}
function normalise() {
  STORE.sessions ||= {}; STORE.live ??= null; STORE.venues ||= {};
  STORE.venues.Casino ||= []; STORE.venues.Private ||= []; STORE.venues.Home ||= [];
  // One earlier version stored Casino/Private as the venue itself; fold those back under Public/Home.
  for (const x of [...Object.values(STORE.sessions), STORE.live]) {
    if (!x) continue;
    if (x.venue === "Casino") { x.venue = "Public"; x.kind = "Casino"; }
    else if (x.venue === "Private") { if (x.venueName) { x.venue = "Public"; x.kind = "Private"; } else x.venue = "Home"; }
  }
}
function persist(dirty = true) {
  if (!STORE) return;
  if (dirty) STORE.dirty = true;
  sync();
  saving = saving.then(seal).catch(() => toast("Couldn't save on this phone. Make a backup now."));
}
function sync() {
  S.hands = Object.entries(HSTORE.hands).map(([id, d]) => ({ id, ...d }));
  S.sessions = STORE ? Object.entries(STORE.sessions).map(([id, d]) => ({ id, ...d })) : [];
  S.live = STORE?.live ? { ...STORE.live } : null;
  if (STORE) {   // remember just the blind levels, so the hand form can offer them while stats are locked
    const b = blindsList();
    if (JSON.stringify(b) !== JSON.stringify(HSTORE.stakes)) { HSTORE.stakes = b; try { localStorage.setItem(HANDS_KEY, JSON.stringify(HSTORE)); } catch (e) {} }
  }
  S.loading = false; render();
}
const handsDb = {
  doc(id) {
    return {
      async set(d) { HSTORE.hands[id] = { ...d }; saveHands(); },
      async update(d) { const cur = HSTORE.hands[id]; if (!cur) throw { code: "not_found" }; Object.assign(cur, d); saveHands(); },
      async delete() { delete HSTORE.hands[id]; saveHands(); },
    };
  },
  async add(d) { const id = newId(); HSTORE.hands[id] = { ...d }; saveHands(); return { id }; },
};
const localDb = {
  doc(path) {
    const [c, id] = path.split("/");
    if (c === "hands") return handsDb.doc(id);
    return {
      async set(d) { if (c === "live") STORE.live = { ...d }; else STORE[c][id] = { ...d }; persist(); },
      async update(d) {
        const cur = c === "live" ? STORE.live : STORE[c][id];
        if (!cur) throw { code: "not_found" };
        Object.assign(cur, d); persist();
      },
      async delete() { if (c === "live") STORE.live = null; else delete STORE[c][id]; persist(); },
    };
  },
  collection(c) { return c === "hands" ? { add: handsDb.add } : { async add(d) { const id = newId(); STORE[c][id] = { ...d }; persist(); return { id }; } }; },
};

function unlocked() {
  normalise();
  const had = !!STORE.hands, moved = moveHandsOut();

// Locks your stats. Hands stay open.
function lock() {
  if (!STORE) return;

async function setupPassword(f) {
  const a = $("#pw1").value, b = $("#pw2").value;

  SALT = crypto.getRandomValues(new Uint8Array(16)); CK = await deriveKey(a, SALT); STORE = old;

}

    <button class="btn primary block" data-action="backup">Back up to Files or iCloud</button>

    <input type="file" id="restore-file" class="sr-file" accept=".json,application/json">
    <h3 style="margin-top:8px">Password</h3>

    <p class="foot">App version ${APP_VERSION}</p>
    <p class="foot">Restoring adds the sessions and hands in the file. Entries already on this phone are kept, so restoring the same file twice doesn't create duplicates.</p>
  </div>`;
}
async function backup() {
  const data = { app: "poker-tracker", version: 2, exportedAt: new Date().toISOString(), sessions: STORE.sessions, hands: HSTORE.hands, live: STORE.live, venues: STORE.venues };
  const name = `Poker Tracker backup ${todayISO()}.json`;
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: "Poker Tracker backup" });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    STORE.lastBackup = Date.now(); STORE.dirty = false; persist(false);
    closeSheet(); toast("Backup saved");
  } catch (e) { if (e?.name !== "AbortError") toast("The backup didn't save. Try again."); }
}
async function restore(file) {
  try {
    const j = JSON.parse(await file.text());
    const toMap = x => Array.isArray(x) ? Object.fromEntries(x.map(({ id, ...d }) => [id || newId(), d])) : (x || {});
    const sm = toMap(j.sessions), hm = toMap(j.hands);
    const ns = Object.keys(sm).length, nh = Object.keys(hm).length;
    if (!ns && !nh) throw new Error("empty");
    Object.assign(STORE.sessions, sm); Object.assign(HSTORE.hands, hm); if (nh) saveHands();
    if (j.live && !STORE.live) STORE.live = j.live;
    if (j.venues) for (const t of ["Casino", "Private", "Home"]) for (const n of j.venues[t] || []) rememberVenue(t, n);
    normalise(); persist(false);
    closeSheet(); setTab("home");
    toast(`Restored ${ns} session${ns === 1 ? "" : "s"}${nh ? ` and ${nh} hand${nh === 1 ? "" : "s"}` : ""}`);
  } catch (e) { toast("That file isn't a Poker Tracker backup."); }
}

let R = null, RH = [];   // recorder state and undo history

function qcfg() { try { return { ...QH_DEFAULT, ...(JSON.parse(localStorage.getItem(QH_CFG)) || {}) }; } catch (e) { return { ...QH_DEFAULT }; } }
function saveCfg(c) { try { localStorage.setItem(QH_CFG, JSON.stringify(c)); } catch (e) {} }
function saveDraft() { try { if (R && R.step !== "setup") localStorage.setItem(QH_DRAFT, JSON.stringify(R)); else localStorage.removeItem(QH_DRAFT); } catch (e) {} }

const isCash = () => R.cfg.game === "Cash";

const stepAmt = () => isCash() ? (R.cfg.bb >= 1 ? 1 : 0.05) : Math.max(1, R.cfg.bb / 4);

function nextActor(fromPos) {

// Players still to act this street, in order, from the current actor up to and including you.

function snap() { RH.push(JSON.stringify(R)); if (RH.length > 300) RH.shift(); }

function startHand(heroPos) {

function act(type, to, quiet) {

function advance(fromPos) {

function endStreet() {

function toResult() {

// cards
function pickTarget() { const t = R.pick.target; return t === "hero" ? R.hero.cards : t === "board" ? R.board : t.startsWith("show:") ? P(t.slice(5)).shown : null; }

// notes in the same shorthand used for typed hands
function recText() {

    ${callAll ? "" : `<div class="eyebrow">${verb}</div>
    <div class="size-grid">${sizes.map(o => `<button class="rbtn" data-r="raise" data-v="${o.to}">${A(o.to)}<small>${o.sub}</small></button>`).join("")}
      <button class="rbtn" data-r="custom">Other<small>amount</small></button>
      <button class="rbtn warn" data-r="ai">All-in<small>${A(max)}</small></button></div>
    ${R.ui.custom ? `<div class="askbar" style="margin:0"><input class="input num" id="rec-amt" inputmode="decimal" placeholder="${verb} ${isCash() ? "£" : ""}…"><button class="btn primary" data-r="customgo">${verb}</button></div>
      <div class="err">${esc(R.ui.err || `Minimum ${A(Math.min(minTo, max))}`)}</div>` : ""}`}
    ${heroAhead ? `<button class="rbtn pri" data-r="skip" data-v="${R.hero.pos}">${R.curBet - P(R.hero.pos).bet > 0 || R.street === "pre" ? "Folds" : "Checks"} to you</button>` : ""}
    ${R.ui.edit ? `<div class="askbar" style="margin:0"><input class="input num" id="rec-stack" inputmode="decimal" placeholder="${R.ui.edit} stack"><button class="btn primary" data-r="stackgo">Set ${R.ui.edit} stack</button></div>` : ""}
    <div class="seats">${actOrder().map(pos => {
      const q = P(pos), skippable = up.indexOf(pos) > 0;
      const status = q.folded ? "folded" : q.allin ? `all-in ${A(q.inv)}` : q.bet ? A(q.bet) : "";
      return `<div class="seat ${q.folded ? "out" : ""} ${pos === R.cur ? "now" : ""} ${skippable ? "skip" : ""}" ${skippable ? `data-r="skip" data-v="${pos}"` : ""}>
        <span>${pos === R.hero.pos ? `<b>You</b> <span class="muted">${pos}</span>` : pos}</span><span>${status}</span>
        ${q.folded ? "<span></span>" : `<span class="seat-stack" data-r="stack" data-v="${pos}">${A(q.left)}</span>`}</div>`;
    }).join("")}</div>
    <p class="foot" style="margin:0">Tap a player further down to skip to them: everyone in between ${R.curBet > 0 ? "folds" : "checks"}. Tap a stack to change it.</p>
  </div>`;
}
function recResult() {
  const h = P(R.hero.pos), opp = live().filter(p => p !== h), o = R.result.outcome;
  const fixed = h.folded || live().length === 1;
  const net = o ? heroNet() : null;
  const t = R.pick.target;
  return `<div class="stack">
    <div class="rec-street"><b>Result</b>${R.board.length ? `<span>${R.board.map(cardHtml).join("")}</span>` : ""}<span class="muted">Pot ${A(potTotal())}</span></div>
    ${fixed ? `<div class="actor me"><b>${h.folded ? "You folded" : "Everyone folded · you won"}</b></div>`
      : `<div class="act-grid" style="grid-template-columns:repeat(3,1fr)">${[["won", "Won"], ["lost", "Lost"], ["split", "Split"]].map(([v, l]) => `<button class="rbtn ${o === v ? "on" : ""}" data-r="out" data-v="${v}">${l}</button>`).join("")}</div>`}
    ${o ? `<div class="preview"><div><div class="eyebrow">This hand</div><b class="num ${cls(net)}">${net === 0 ? "£0" : (net > 0 ? "+" : "−") + A(Math.abs(net))}</b></div><div style="text-align:right"><div class="eyebrow">Your stack now</div><b class="num">${A(h.stack + net)}</b></div></div>` : ""}
    <div class="err">${esc(R.ui.err || "")}</div>
    ${(h.folded ? live() : opp).length ? `<h3>Shown cards <span class="muted" style="font-weight:500">· optional</span></h3>
      ${(h.folded ? live() : opp).map(p => `<div class="did" style="margin:0"><span><b>${p.pos}</b> ${p.shown.map(cardHtml).join("")}</span>
        <button class="linkbtn" data-r="show" data-v="${p.pos}">${p.shown.length ? "Change" : "Add cards"}</button></div>
        ${t === "show:" + p.pos ? picker(`${p.pos}'s cards`, p.shown, 2) : ""}`).join("")}` : ""}
    <button class="rbtn ${R.result.flag ? "on" : ""}" data-r="flag">${R.result.flag ? "★ Marked for review" : "☆ Mark for review"}<small>for spots you're unsure about</small></button>
    <label class="field"><span>Anything else? <span style="font-weight:400">optional</span></span><input class="input" data-note value="${esc(R.result.note || "")}" placeholder="Reads, what you were unsure about"></label>
    <details class="guide"><summary>See the notes this creates</summary><pre>${esc(recText())}</pre></details>
    <div class="act-grid"><button class="rbtn" data-r="save">Save hand</button><button class="rbtn pri" data-r="savenext">Save · next hand</button></div>
  </div>`;
}
$("#rec").addEventListener("click", e => {
  const t = e.target.closest("[data-r]"); if (!t || t.disabled) return;
  const r = t.dataset.r, v = t.dataset.v;
  R.ui ||= {};
  switch (r) {
    case "close": return closeRec();
    case "undo": if (RH.length) { R = JSON.parse(RH.pop()); } break;
    case "cfg": R.showCfg = !R.showCfg; break;
    case "strtoggle": R.cfg.straddleOn = !R.cfg.straddleOn; saveCfg(R.cfg); break;
    case "stakes": { const m = v.match(/[\d.]+/g); if (m && m.length >= 2) { R.cfg.sb = +m[0]; R.cfg.bb = +m[1]; } break; }
    case "seats": R.cfg.seats = Math.min(10, Math.max(3, R.cfg.seats + +v)); break;
    case "pos": RH = []; startHand(v); break;
    case "repos": RH = []; R = { step: "setup", cfg: R.cfg, ui: {} }; break;
    case "rank": R.pick.rank = R.pick.rank === v ? null : v; break;
    case "suit": if (R.pick.rank) addCard(R.pick.rank + v); break;
    case "unknown": { snap(); while (R.board.length < BOARD_LEN[R.street]) R.board.push("?"); R.pick.rank = null; boardDone(); break; }
    case "f": case "x": case "c": R.ui = {}; act(r); break;
    case "raise": R.ui = {}; act("r", +v); break;
    case "ai": { R.ui = {}; const p = P(R.cur); act("r", p.bet + p.left); break; }
    case "custom": R.ui = { custom: !R.ui.custom }; break;
    case "customgo": {
      const n = readNum($("#rec-amt")?.value), p = P(R.cur), max = p.bet + p.left, minTo = R.curBet === 0 ? +R.cfg.bb : R.curBet + R.lastRaise;
      if (!isNum(n) || n <= 0) { R.ui.err = "Type the amount, e.g. 25."; break; }
      if (n < minTo && n < max) { R.ui.err = `The minimum is ${A(minTo)}.`; break; }
      R.ui = {}; act("r", n); break;
    }
    case "skip": R.ui = {}; skipTo(v); break;
    case "stack": R.ui = { edit: v }; break;
    case "stackgo": {
      const n = readNum($("#rec-stack")?.value), q = P(R.ui.edit);
      if (q && isNum(n) && n >= 0) { snap(); q.stack = n + q.inv; q.left = n; q.allin = !q.folded && n === 0; }
      R.ui = {}; break;
    }
    case "out": R.result.outcome = v; R.ui = {}; break;
    case "show": if (R.pick.target === "show:" + v) R.pick = { target: "", rank: null }; else { snap(); R.pick = { target: "show:" + v, rank: null }; P(v).shown = []; } break;
    case "flag": R.result.flag = !R.result.flag; break;
    case "save": return saveRec(false);
    case "savenext": return saveRec(true);
    case "discard": R.ui.discard = true; break;
    case "discardno": R.ui.discard = false; break;
    case "discardyes": RH = []; R = { step: "setup", cfg: R.cfg, ui: {} }; break;
  }
  renderRec();
});
$("#rec").addEventListener("input", e => {
  const k = e.target.dataset.cfg;
  if (k) {
    const n = readNum(e.target.value);
    if (k === "straddle") { if (isNum(n) && n > 0) R.cfg.straddles = { ...(R.cfg.straddles || {}), [stakeKey(R.cfg)]: n }; saveCfg(R.cfg); return; }
    if (isNum(n) && n >= 0) R.cfg[k] = n; return;
  }
  if (e.target.hasAttribute("data-note")) { R.result.note = e.target.value; saveDraft(); }
});
$("#rec").addEventListener("change", e => { if (e.target.name === "rgame") { R.cfg.game = e.target.value; renderRec(); } });


// ---------- boot ----------
S.db = localDb;
sync();
showLock(readVault() ? "unlock" : "setup");
try { navigator.storage?.persist?.(); } catch (e) {}
if ("serviceWorker" in navigator) addEventListener("load", () => {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
});
</script>
</body>
